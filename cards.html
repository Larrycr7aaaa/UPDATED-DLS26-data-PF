<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DLS 26 Cards SPA</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>

<body>

    <!-- ========================= -->
    <!-- HEADER -->
    <!-- ========================= -->

    <header>
        <div class="logo">
            <div>
                <h1>DLS 26 SPA</h1>
                <p>Colección Oficial de Cartas</p>
            </div>
        </div>

        <div class="search">
            <input type="text" id="searchInput" placeholder="Buscar por jugador, equipo, país...">
            <button id="searchButton">Buscar</button>
        </div>
    </header>

    <!-- ========================= -->
    <!-- MAIN -->
    <!-- ========================= -->

    <main>
        <!-- ========================= -->
        <!-- LISTA DE JUGADORES -->
        <!-- ========================= -->

        <section class="player-list">
            <div class="section-title">
                <h2>Jugadores</h2>
                <span id="playerCounter">0 Jugadores</span>
            </div>

            <div id="playerContainer">
                <!-- Tarjetas cargadas mediante JavaScript -->
            </div>

            <div class="pagination">
                <button id="previousBtn">⬅ Anterior</button>
                <button id="nextBtn">Siguiente ➜</button>
            </div>
        </section>

        <!-- ========================= -->
        <!-- DETALLE DEL JUGADOR -->
        <!-- ========================= -->

        <aside class="player-detail">
            <div id="detailContainer">
                <h2>Selecciona un jugador</h2>
                <p>Haz clic en "Ver Información" de cualquier carta para ver sus atributos completos.</p>
            </div>
        </aside>
    </main>

    <!-- ========================= -->
    <!-- LOADING -->
    <!-- ========================= -->

    <div id="loading" class="hidden">
        <div class="loader"></div>
        <p>CARGANDO...</p>
    </div>

    <!-- ========================= -->
    <!-- ERROR -->
    <!-- ========================= -->

    <div id="errorMessage" class="hidden">
        Jugador no encontrado.
    </div>

    <!-- ========================= -->
    <!-- FOOTER -->
    <!-- ========================= -->

    <footer>
        <p>Proyecto SPA utilizando API DLS 26</p>
        <p>HTML • CSS • JavaScript • Fetch API</p>
    </footer>

    <script src="script.js"></script>

</body>

</html>
